name: Windows Test Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/4.3.stable
          cp -r /root/.local/share/godot/export_templates/4.3.stable/* /github/home/.local/share/godot/export_templates/4.3.stable/

      - name: Build Windows EXE
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/LumberjackJohn.exe

      - name: Package build
        run: |
          cd build
          zip -9 LumberjackJohn-Windows.zip LumberjackJohn.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumberjackJohn-Windows
          path: build/LumberjackJohn-Windows.zip
          if-no-files-found: error
