name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "project.godot"
      - "export_presets.cfg"
      - "assets/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: LumberjackJohn

jobs:
  android-debug-apk:
    name: Build installable Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd

    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot CI environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi

      - name: Parse project and import resources
        run: godot --headless --editor --quit --path .

      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android" "$(pwd)/build/android/${EXPORT_NAME}.apk"
          test -f "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumberjackJohn-Android-APK
          path: build/android/LumberjackJohn.apk
          if-no-files-found: error
          retention-days: 14
